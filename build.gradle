plugins {
    id 'fabric-loom' version '1.11.8'
    id 'maven-publish'
    id 'java'
}

group = 'oresAboveDiamonds'
version = '1.0.0'
archivesBaseName = 'ores-above-diamonds'

repositories {
    mavenCentral()
    maven {
        name = "Fabric"
        url = "https://maven.fabricmc.net/"
    }
}

dependencies {
    // Minecraft and mappings
    minecraft "com.mojang:minecraft:1.21.1"
    mappings loom.officialMojangMappings()

    // Fabric loader & API versions compatible with 1.21.1
    modImplementation "net.fabricmc:fabric-loader:0.16.9"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.107.0+1.21.1"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)   // ✅ use Java 21
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release.set(21)                           // ✅ compile for Java 21
}
