plugins {
    id 'fabric-loom' version '1.11.8'
    id 'maven-publish'
    id 'java'
}

group = "oresabovediamonds"
version = "1.0.0"
archivesBaseName = "oresabovediamonds"

repositories {
    mavenCentral()
    maven { url 'https://maven.fabricmc.net/' }
    maven { url 'https://maven.terraformersmc.com/' }
    maven { url 'https://maven.shedaniel.me/' }
}

dependencies {
    minecraft "com.mojang:minecraft:1.21.1"
    mappings "net.fabricmc:yarn:1.21.1+build.1:v2"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.136.0+1.21.10"
    modImplementation "me.shedaniel.cloth:cloth-config-fabric:19.0.147"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

loom {
    splitEnvironmentSourceSets()
    runs {
        client {
            client()
            runDir "run"
        }
        server {
            server()
            runDir "run"
        }
    }
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}
